name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest's V8 coverage needs Node; `bun run` hands the tool binaries to it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Code samples in the README and docs are in sync
        run: node scripts/samples.js --check
      - name: Reference pages cover the public API
        run: node scripts/docs-drift.js
      - name: Repository scripts
        run: bun run test:scripts
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test with coverage
        run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: packages/vue-docx-document/coverage/lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Build (library, size-limit budgets, demo)
        run: bun run build
      - name: Check the package (publint, type resolution)
        run: bun run lint:package
      - name: Install the packed tarball and render from it
        run: bun run test:pack
      - name: Browser tests of the rendering (Chromium, Firefox, WebKit)
        run: |
          (cd packages/vue-docx-document && bunx playwright install --with-deps chromium firefox webkit)
          bun run test:browser
      - name: End-to-end tests of the demo app
        run: bun run --filter example test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/example/test-results/
          retention-days: 7
      - name: Build docs
        run: bun run build:docs

  # The library declares vue ^3.5.0, so it's tested against the oldest version in that
  # range and against the newest one on npm, not only the version in bun.lock.
  vue-versions:
    name: Vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.5.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The peer range is the tested floor
        run: |
          range=$(node -p "require('./packages/vue-docx-document/package.json').peerDependencies.vue")
          echo "peer range $range"
          [ "$range" = '^3.5.0' ]
      - name: Install with vue@${{ matrix.vue }}
        run: |
          npm pkg set overrides.vue=${{ matrix.vue }}
          bun install
      - name: Check the installed version
        working-directory: packages/vue-docx-document
        env:
          EXPECTED: ${{ matrix.vue }}
        run: |
          actual=$(node -p "require('vue/package.json').version")
          echo "vue $actual"
          if [ "$EXPECTED" != latest ] && [ "$actual" != "$EXPECTED" ]; then exit 1; fi
      - name: Typecheck the library
        run: bun run --filter vue-docx-document typecheck
      - name: Unit tests
        run: bun run test

  # The package declares node >=20.19, so the packed tarball is installed and rendered on the
  # oldest and the newest release; the main job covers 22. The build tooling and Vitest 5 need
  # Node 22 or newer, so the library is built on 22 and only then run on the matrix version.
  # The unit tests run on 24 only.
  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build the library
        run: bun run build:lib
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        if: matrix.node != 20
        run: bun run test
      - name: Install the packed tarball and render from it
        run: bun run test:pack

  # A change to the library's source needs an entry under "Unreleased" in its changelog.
  # Label a pull request "no-changelog" to skip the check, for a refactor nobody will notice.
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Changelog has an entry for source changes
        run: node scripts/changelog-check.js "origin/${{ github.base_ref }}"
